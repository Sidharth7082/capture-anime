# capture-anime.conf — combined nginx site for the Capture Anime stack.
# Includes all three server blocks (backend API, anivexa, frontend web).
# Install by symlinking this into /etc/nginx/sites-enabled/ (see install-nginx.sh)
# and running: sudo nginx -t && sudo systemctl reload nginx

# Per-service server blocks
include /home/capture/pro/nginx/sites-available/anime-api.conf;
include /home/capture/pro/nginx/sites-available/anivexa.conf;
include /home/capture/pro/nginx/sites-available/anime-web.conf;
