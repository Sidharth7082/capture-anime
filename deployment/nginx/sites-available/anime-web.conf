# anime-web.conf — Capture Anime frontend reverse proxy (Netlify-hosted).
# Routes anime.local / captureordie.online / the LAN IP -> the local build in
# /var/www/capture-anime (or Netlify via proxy_pass below).
#
# The frontend deploys on Netlify from GitHub. Use this only if you want to
# serve the site through your own nginx/domain instead of Netlify's CDN.
# Uncomment the proxy_pass below and set NETLIFY_URL to your deployed site.
#
# If instead you run the frontend locally (vite dev / preview), point the
# proxy_pass to http://127.0.0.1:5173 instead.

server {
    listen 80;
    listen [::]:80;
    # The LAN IP makes http://192.168.0.193/ serve the SPA build; without it
    # the bare-IP request falls through to the first server block (the API
    # proxy) and returns the backend's JSON 404.
    server_name anime.local captureordie.online www.captureordie.online 192.168.0.193;

    # ---- HTTPS ready (enable once certbot/DNS exists) ----
    # listen 443 ssl;
    # listen [::]:443 ssl;
    # http2 on;
    # ssl_certificate     /etc/letsencrypt/live/captureordie.online/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/captureordie.online/privkey.pem;

    root /var/www/capture-anime;
    index index.html;

    # Netlify-hosted frontend proxy (uncomment when you want to front it):
    # location / {
    #     include /etc/nginx/proxy_params;
    #     proxy_pass https://NETLIFY_URL;
    # }

    # Local SPA fallback (if you serve a build from /var/www/capture-anime):
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static asset caching
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}
