# anime-api.conf — Capture Anime backend reverse proxy.
# Routes api.anime.local / api.captureordie.online -> http://127.0.0.1:3000
#
# After the "server_name" hostnames are real, drop this file into
# /etc/nginx/sites-enabled/ (see ../install-nginx.sh) and reload nginx.

server {
    listen 80;
    listen [::]:80;
    server_name api.anime.local api.captureordie.online;

    # ---- HTTPS ready (enable once certbot/DNS exists) ----
    # listen 443 ssl;
    # listen [::]:443 ssl;
    # http2 on;
    # ssl_certificate     /etc/letsencrypt/live/api.captureordie.online/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.captureordie.online/privkey.pem;

    location / {
        include /etc/nginx/proxy_params;
        proxy_pass http://127.0.0.1:3000;
    }

    # Optional: a basic /health passthrough for uptime monitors
    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
        access_log off;
    }
}
